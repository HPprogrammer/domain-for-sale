<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Domain is Available</title>
<style>
  :root{
    --ink:#0B1120;
    --grid:#1B2A44;
    --gold:#F4B942;
    --paper:#F5F3EC;
    --slate:#8FA1BE;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--ink);
    overflow:hidden;
  }

  body{
    font-family:'JetBrains Mono', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* Blueprint grid backdrop */
  .grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:44px 44px;
    background-position:center;
    opacity:0;
    animation:fadeGrid 2s ease-out forwards;
    mask-image:radial-gradient(circle at center, black 10%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at center, black 10%, transparent 75%);
  }

  @keyframes fadeGrid{
    to{opacity:0.6;}
  }

  /* faint drifting scanline for atmosphere */
  .scan{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(244,185,66,0.04) 50%, transparent 100%);
    background-size:100% 300%;
    animation:drift 9s linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    0%{background-position:0 0;}
    100%{background-position:0 300%;}
  }

  .parcel{
    position:relative;
    z-index:2;
    text-align:center;
    padding:64px 56px;
    max-width:560px;
    width:90%;
  }

  /* Surveyor corner marks that draw themselves in */
  .corner{
    position:absolute;
    width:26px;
    height:26px;
    border-color:var(--gold);
    opacity:0;
    animation:popCorner 0.6s ease-out forwards;
  }
  .corner.tl{top:0;left:0;border-top:2px solid var(--gold);border-left:2px solid var(--gold);animation-delay:0.9s;}
  .corner.tr{top:0;right:0;border-top:2px solid var(--gold);border-right:2px solid var(--gold);animation-delay:1.05s;}
  .corner.bl{bottom:0;left:0;border-bottom:2px solid var(--gold);border-left:2px solid var(--gold);animation-delay:1.2s;}
  .corner.br{bottom:0;right:0;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);animation-delay:1.35s;}

  @keyframes popCorner{
    from{opacity:0;transform:scale(0.6);}
    to{opacity:1;transform:scale(1);}
  }

  .eyebrow{
    color:var(--gold);
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    opacity:0;
    animation:riseIn 0.7s ease-out 0.3s forwards;
  }

  .eyebrow::before{
    content:"◆ ";
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    color:var(--paper);
    font-size:clamp(32px, 5.5vw, 52px);
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.15;
    margin:18px 0 14px;
    opacity:0;
    animation:riseIn 0.8s ease-out 0.5s forwards;
  }

  p.sub{
    color:var(--slate);
    font-size:14px;
    line-height:1.7;
    margin:0 auto 34px;
    max-width:400px;
    opacity:0;
    animation:riseIn 0.8s ease-out 0.7s forwards;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:transparent;
    color:var(--gold);
    border:1.5px solid var(--gold);
    padding:14px 28px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.06em;
    text-decoration:none;
    border-radius:2px;
    opacity:0;
    animation:riseIn 0.8s ease-out 0.9s forwards, pulseBorder 2.8s ease-in-out 2s infinite;
    transition:background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .cta{
    cursor:default;
  }

  .cta .email{
    cursor:text;
    user-select:all;
  }

  .cta:hover{
    background:var(--gold);
    color:var(--ink);
    transform:translateY(-2px);
  }

  @keyframes pulseBorder{
    0%,100%{box-shadow:0 0 0 0 rgba(244,185,66,0.0);}
    50%{box-shadow:0 0 0 6px rgba(244,185,66,0.06);}
  }

  .stake{
    display:inline-block;
    transform-origin:bottom center;
    animation:sway 4.2s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
  }

  .coords{
    margin-top:40px;
    font-size:10px;
    letter-spacing:0.15em;
    color:var(--grid);
    opacity:0;
    animation:riseIn 0.8s ease-out 1.1s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

  <div class="grid"></div>
  <div class="scan"></div>

  <main class="parcel">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="eyebrow">Status &mdash; Available</div>
    <h1><span class="stake">🏷️</span> This Domain<br>is Available for Sale</h1>
    <p class="sub">This domain is available for sale. Contact us to buy it.</p>
    
    <span class="cta">✉ Contact — <span class="email">himanshuprajapati26678039@gmail.com</span></span>
    <br></br>
    <span class="cta">✉ Contact — <span class="email">vikashverma7249@gmail.com</span></span>
    <div class="coords">LAT 28.7041° N · LON 77.1025° E · PLOT 001</div>
  </main>

</body>
</html>
